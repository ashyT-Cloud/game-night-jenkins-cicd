<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Night — Space Shooter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arcade">
    <header>
      <p class="eyebrow">GAME NIGHT ARCADE</p>
      <h1>SPACE SHOOTER</h1>
      <p>Dodge asteroids. Shoot for the stars.</p>
    </header>

    <section class="hud" aria-label="Game status">
      <span>Score: <strong id="score">0</strong></span>
      <span>Lives: <strong id="lives">3</strong></span>
    </section>

    <canvas id="game" width="480" height="600"
      aria-label="Space shooter game area"></canvas>

    <p id="status" role="status">Ready for launch?</p>
    <button id="start">START GAME</button>
    <p class="controls">Move: ← → or A / D · Shoot: Space</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
